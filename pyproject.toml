[project]
name = "prediql"
version = "0.1.0"
description = "Iterative, evidence-grounded LLM fuzzer for GraphQL APIs"
requires-python = ">=3.11"
dependencies = [
    "graphql-core>=3.2",   # real GraphQL parsing (coverage construct-validity, doc 11)
    "httpx>=0.27",         # async HTTP to the target
    "pyyaml>=6",           # ground-truth contract files
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
predql = "prediql.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["prediql*"]
